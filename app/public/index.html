<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MX Wharehouse</title>
<script>/* Tema antes de pintar (sin parpadeo). Oscuro por defecto; la elección se guarda en este navegador. */
try { document.documentElement.dataset.theme = localStorage.getItem('mxw-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="shell" hidden>
  <div class="topbar">
  <header class="navbar">
    <div class="nb-in">
      <a class="brandmark" href="#"><div class="sq">MX</div><div><b>MX Wharehouse</b><small>Incidencias de registro · <span class="appver" translate="no"></span></small></div></a>
      <span class="sp"></span>
      <div class="printer" id="agent"><span class="dot"></span> Agente de búsqueda…</div>
      <div class="prefs">
        <div class="langsw" role="group" aria-label="Idioma"><button type="button" data-lang-btn="es" data-a="lang" data-v="es" translate="no">ES</button><button type="button" data-lang-btn="en" data-a="lang" data-v="en" translate="no">EN</button></div>
        <button type="button" class="iconbtn" data-a="theme" id="themebtn" title="Cambiar a tema claro" aria-label="Cambiar a tema claro"><svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      </div>
      <div class="opsel"><div class="av on" id="whoav" translate="no"></div><div class="whotxt"><b id="who" translate="no"></b><span class="rolechip" id="rolechip"></span></div><button class="btn sm" data-a="logout">Salir</button></div>
    </div>
  </header>
  <nav class="hmenu" aria-label="Menú principal"><div class="nav" id="nav"></div></nav>
  </div>
  <div class="main wrap">
    <div class="crumb" id="crumb"></div>
    <main id="view"></main>
  </div>
</div>
<main id="loginview" hidden></main>
<div id="toast" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
