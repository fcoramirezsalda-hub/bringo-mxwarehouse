<title>MX Wharehouse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: consola de piso de bodega — barra lateral por rol, estación de escaneo para operadores, panel de tickets compartido Victor + Customer Service */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#17201D; --muted:#5A6762; --line:#D2D9D5;
  --brand:#1E4F47; --brand-ink:#FFFFFF; --hi:#F2B01E; --hi-ink:#2A1D00;
  --mx:#21995B; --es:#2F55C4;
  --ok:#21804D; --warn:#AD6600; --bad:#BF3A2C; --info:#2E69AE;
  --paper:#FFFFFF; --paper-ink:#111111;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171D1B; --sunk:#0B0F0D; --ink:#E3EAE7; --muted:#8F9D98; --line:#29322F;
  --brand:#5FB3A3; --brand-ink:#08201B; --hi:#F5BC3A; --hi-ink:#2A1D00;
  --mx:#43C682; --es:#7393F2; --ok:#4CC383; --warn:#E8A33A; --bad:#F06B5B; --info:#6AA6EA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171D1B; --sunk:#0B0F0D; --ink:#E3EAE7; --muted:#8F9D98; --line:#29322F;
  --brand:#5FB3A3; --brand-ink:#08201B; --hi:#F5BC3A; --hi-ink:#2A1D00;
  --mx:#43C682; --es:#7393F2; --ok:#4CC383; --warn:#E8A33A; --bad:#F06B5B; --info:#6AA6EA; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brandmark{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brandmark .sq{width:30px;height:30px;border-radius:5px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brandmark b{font-family:var(--f-display);font-size:1.15rem;line-height:1}
.brandmark small{display:block;color:var(--muted);font-size:.75rem}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow:auto;flex:1}
.nav .grp{padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:color-mix(in oklab,var(--brand) 14%,var(--surface));box-shadow:inset 3px 0 0 var(--brand)}
.nav a .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:.72rem;padding:1px 7px;font-weight:600}
.nav a .cnt.n{background:var(--sunk);color:var(--muted)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.printer{border-top:1px solid var(--line);padding:12px 18px;font-size:.82rem;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{font-size:.88rem;color:var(--muted)} .crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.clock{display:flex;align-items:center;gap:8px;font-size:.84rem;border:1px dashed var(--line);border-radius:5px;padding:4px 6px 4px 10px}
.opsel{display:flex;align-items:center;gap:8px;font-size:.85rem}
.rolechip{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:80px}
#view{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost-danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 50%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.link{border:0;background:none;padding:0;color:var(--info);text-decoration:underline;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.done{border-color:var(--ok);color:var(--ok)}
.btn.full{width:100%}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;border-radius:4px;padding:2px 8px;white-space:nowrap}
.chip.mx{background:color-mix(in oklab,var(--mx) 16%,var(--surface));color:var(--mx)}
.chip.es{background:color-mix(in oklab,var(--es) 16%,var(--surface));color:var(--es)}
.chip.ok{background:color-mix(in oklab,var(--ok) 15%,var(--surface));color:var(--ok)}
.chip.warn{background:color-mix(in oklab,var(--warn) 16%,var(--surface));color:var(--warn)}
.chip.bad{background:color-mix(in oklab,var(--bad) 14%,var(--surface));color:var(--bad)}
.chip.info{background:color-mix(in oklab,var(--info) 15%,var(--surface));color:var(--info)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.solid-bad{background:var(--bad);color:#fff}

/* Escaneo */
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.scanbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.scanrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.scaninput{flex:1 1 280px;font-family:var(--f-mono)!important;font-size:1.5rem!important;letter-spacing:.06em;padding:14px 16px!important;border:2px solid var(--line)!important}
.scaninput:focus{border-color:var(--hi)!important;outline:none;box-shadow:0 0 0 4px color-mix(in oklab,var(--hi) 25%,transparent)}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;font-size:.82rem}
.sample{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:.8rem}
.sample:hover{border-color:var(--hi)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;border:1px solid}
.banner b{display:block;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
.banner.warn{background:color-mix(in oklab,var(--warn) 10%,var(--surface));border-color:color-mix(in oklab,var(--warn) 45%,var(--line))}
.banner.bad{background:color-mix(in oklab,var(--bad) 9%,var(--surface));border-color:color-mix(in oklab,var(--bad) 45%,var(--line))}
.banner.info{background:color-mix(in oklab,var(--info) 9%,var(--surface));border-color:color-mix(in oklab,var(--info) 40%,var(--line))}
.banner.ok{background:color-mix(in oklab,var(--ok) 9%,var(--surface));border-color:color-mix(in oklab,var(--ok) 40%,var(--line))}
.banner .ic{font-family:var(--f-display);font-weight:700;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.banner.warn .ic{background:var(--warn)} .banner.bad .ic{background:var(--bad)} .banner.info .ic{background:var(--info)} .banner.ok .ic{background:var(--ok)}

.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.order-head{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:16px}
.thumb{width:84px;height:84px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.5rem;background:color-mix(in oklab,hsl(var(--h) 55% 50%) 22%,var(--surface));color:hsl(var(--h) 45% 40%);border:1px solid var(--line)}
.code{font-family:var(--f-mono);font-weight:600;font-size:1.15rem}
.prod{font-weight:600;margin:4px 0 10px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 16px}
.meta div{min-width:0} .meta .v{font-size:.9rem;overflow-wrap:anywhere}
.order-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 16px;border-top:1px solid var(--line);background:color-mix(in oklab,var(--sunk) 45%,var(--surface))}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.kv .full{grid-column:1/-1}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.steps>li:first-child{border-top:0;padding-top:0}
.stepn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted)}
li.cur .stepn{border-color:var(--hi);color:var(--ink);background:color-mix(in oklab,var(--hi) 20%,var(--surface))}
li.done .stepn{border-color:var(--ok);background:var(--ok);color:#fff}
.steps h3{margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--ok);flex:none}

.zone{display:flex;gap:14px;align-items:center;border:1px dashed var(--line);background:color-mix(in oklab,var(--sunk) 45%,var(--surface));border-radius:var(--r);padding:10px 14px;flex-wrap:wrap}
.zone .big{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1}
.zone .z2{color:var(--warn)} .zone .z1{color:var(--info)}
.actbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:14px 16px;background:color-mix(in oklab,var(--ok) 6%,var(--surface))}

.probgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.prob{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.prob b{font-family:var(--f-display);font-size:1.05rem}
.prob span{font-size:.82rem;color:var(--muted)}
.prob:hover{border-color:var(--bad)}
.prob.on{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.file{border:1px dashed var(--line);border-radius:5px;padding:10px;font-size:.85rem;display:flex;flex-direction:column;gap:6px;min-width:0}
.file input{max-width:100%}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:.72rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.pick td{background:color-mix(in oklab,var(--ok) 8%,var(--surface))}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in oklab,var(--hi) 9%,var(--surface))}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.soon td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr:last-child td{border-bottom:0}

.side-col{display:flex;flex-direction:column;gap:14px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
.feed li:first-child{border-top:0}
.feed .t{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);padding-top:2px}
.tree{font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.tree div{display:grid;grid-template-columns:auto 1fr;gap:8px}

/* Tablero */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.05}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.hl{border-color:var(--hi);box-shadow:inset 0 3px 0 var(--hi)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:170px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.86rem}
.hb .bar{height:12px}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Tickets */
.filtersbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filtersbar .field{flex:1 1 150px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.tk-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tk-head .code{font-size:1.4rem}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px}
.facts div{min-width:0}
.facts .v{overflow-wrap:anywhere}
.mgmt{display:flex;flex-direction:column;gap:0}
.mgmt section{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mgmt section:first-child{border-top:0;padding-top:0}
.owner{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--sunk);color:var(--ink);flex:none}
.av.on{background:var(--brand);color:var(--brand-ink)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.tabs button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--brand);color:var(--brand-ink)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);max-width:620px}
.msg.mine{align-self:flex-end;background:color-mix(in oklab,var(--brand) 8%,var(--surface))}
.msg .mh{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.msg img{max-width:220px;border-radius:4px;margin-top:6px;display:block}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.timeline li:first-child{border-top:0}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ev{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);font-size:.78rem}
.ev .im{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-weight:700}
.ev .im img{width:100%;height:100%;object-fit:cover;display:block}
.ev .cap{padding:6px 8px}
.confirmbox{border:1px solid color-mix(in oklab,var(--bad) 45%,var(--line));background:color-mix(in oklab,var(--bad) 6%,var(--surface));border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.countdown{display:flex;gap:10px;align-items:center}
.countdown .bar{flex:1;height:10px}

/* Despacho */
.gaylords{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gl{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.gl .tank{height:70px;border:2px solid var(--line);border-top:0;border-radius:0 0 6px 6px;position:relative;overflow:hidden;background:var(--sunk)}
.gl .tank i{position:absolute;left:0;right:0;bottom:0;background:color-mix(in oklab,var(--info) 55%,var(--surface))}
.gl .tank i.full{background:color-mix(in oklab,var(--warn) 65%,var(--surface))}
.gl b{font-family:var(--f-display);font-size:1.05rem}
.gl.flash{border-color:var(--hi);box-shadow:0 0 0 3px color-mix(in oklab,var(--hi) 30%,transparent)}

/* Equipo */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.mate .who{display:flex;gap:10px;align-items:center}
.mate.lead{border-color:var(--brand)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 div{background:var(--sunk);border-radius:4px;padding:6px 8px}
.stats3 b{font-family:var(--f-display);font-size:1.25rem;display:block;line-height:1.1}
.stats3 span{font-size:.72rem;color:var(--muted)}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}

/* Modal etiqueta */
.overlay{position:fixed;inset:0;background:color-mix(in oklab,#000 55%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:8px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.labels{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.label4x6{background:var(--paper);color:var(--paper-ink);width:280px;max-width:100%;aspect-ratio:4/6;border:1px solid #bbb;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:12px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-body);font-size:11px;line-height:1.3}
.label4x6 .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--paper-ink);padding-bottom:6px}
.label4x6 .car{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.label4x6 .bc svg{width:100%;height:58px;display:block}
.label4x6 .trk{font-family:var(--f-mono);font-size:12px;text-align:center;letter-spacing:.05em}
.label4x6 .box{border:1.5px solid var(--paper-ink);padding:6px}
.label4x6 .big{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}

function createTicket({type,code,plat,note,trk=null,ev=[],loc='',waiting=null,status='Abierto',resolution=null,reg=null}){
  const ex=S.tickets.find(t=>isOpen(t)&&t.type===type&&((code!=='—'&&t.code===code)||(trk&&t.trk===trk)));
  if(ex){hist(ex,'Evento adicional registrado: '+note);ev.forEach(e=>ex.ev.push(e));if(reg)ex.reg=ex.reg||reg;return {t:ex,appended:true};}
  const t={id:'INC-0'+(seq++),trk,code,plat,type,created:NOW,reporter:S.op,dept:isAdmin()?U().dept:'Operación',ev,status,owner:null,waiting,loc,history:[],chat:[],chatOpen:false,due:NOW+3*D,assign:[],note,resolution,dupConfirmed:null,dupDue:null,flags:{},reg};
  t.history.push({at:NOW,who:S.op,text:'Registró la incidencia: '+note});
  if(status==='Resuelto en piso')t.history.push({at:NOW,who:S.op,text:'Resuelto en piso: '+resolution});
  if(status==='Enviado dañado'){t.dmg='Pendiente';t.history.push({at:NOW,who:S.op,text:'Re-empacado y enviado dañado · seguimiento: regresa, dispose de paquetería o entregado'});}
  queueEnrich(t);
  S.tickets.unshift(t);return {t,appended:false};
}

/* ---------- Proceso programado (idempotente) ---------- */
function runJobs(){
  let changes=0;
  for(const t of S.tickets){
    if(!isOpen(t))continue;
    if(!t.dupConfirmed&&NOW>t.due&&!t.flags.late){t.flags.late=true;t.history.push({at:t.due,who:'Proceso programado',text:'Plazo de 3 días vencido · el ticket sigue abierto y se registra el retraso'});changes++;}
    if(t.dupConfirmed&&NOW>=t.dupDue&&!t.flags.dispose&&t.status!=='Dispose programado'){
      t.flags.dispose=true;t.status='Dispose programado';
      t.history.push({at:t.dupDue,who:'Proceso programado',text:'10 días sin resolución → Dispose programado'});
      S.disposeLog.unshift({id:t.id,code:t.code,at:t.dupDue,done:null});changes++;}
  }
  S.jobRuns.unshift({at:NOW,changes});return changes;
}

function footHTML(c){return `<div class="regfoot" id="regfoot"><div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">${esc(TYPES[S.R.type].l)}</span><span class="small">${S.R.type==='danado'?'Re-empácalo y envíalo. Queda en el registro de enviados dañados; no abre ticket para CS.':'Se abre sin responsable para Victor y Customer Service'}</span>
      ${c.miss.length?`<ul class="missing">${c.miss.map(m=>`<li>Falta: ${esc(m)}</li>`).join('')}</ul>`:`<span class="small muted">Se registra a nombre de <b>${esc(S.op)}</b> · ${fdt(NOW)}</span>`}</div>
      <button class="btn danger" data-a="register" ${c.ok?'':'disabled'}>${S.R.type==='danado'?'Registrar envío dañado':'Abrir ticket'}</button></div>`;}
function register(){
  const R=S.R,c=compute(R); if(!c.ok)return;
  const ev=c.ev.map(k=>S.pend[k]).filter(Boolean).map(e=>({...e,by:S.op,at:NOW}));
  const note=`${TYPES[R.type].l}${c.fields.length?' · '+c.fields.map(([k,v])=>k+': '+v).join(' · '):''}`;
  const res=createTicket({type:R.type,code:c.code,plat:R.plat,trk:R.trk,note,ev,loc:c.loc,waiting:c.waiting,status:c.status,resolution:c.resolution,reg:{src:R.src,fields:c.fields,trk:R.trk}});
  S.counts[R.type]=(S.counts[R.type]||0)+1; S.session[S.op]=(S.session[S.op]||0)+1;
  const lbl=c.code!=='—'?c.code:(R.trk||'sin etiqueta');
  logAdd(`${res.appended?'Agregó evento a':'Registró'} ${res.t.id} ${TYPES[R.type].l} · ${lbl}`);
  S.last={id:res.t.id,type:R.type,code:lbl,appended:res.appended};
  S.R=null;S.pend={};S.ui={};render();window.scrollTo(0,0);
}

/* ===================== BANDEJA ===================== */
function filtered(){
  const f=S.fl;
  return S.tickets.filter(t=>t.status!=='Descartado').filter(t=>{
    if(f.st==='abiertos'&&!isOpen(t))return false;
    if(f.st==='sin'&&(!isOpen(t)||t.owner))return false;
    if(f.st==='mios'&&t.owner!==S.op)return false;
    if(f.st==='espera'&&t.status!=='Esperando respuesta')return false;
    if(f.st==='dispose'&&t.status!=='Dispose programado')return false;
    if(f.st==='piso'&&t.status!=='Resuelto en piso')return false;
    if(f.st==='cerrados'&&isOpen(t))return false;
    if(f.owner!=='todos'&&(f.owner==='sin'?t.owner:t.owner!==f.owner))return false;
    if(f.orig!=='todos'&&t.plat!==f.orig)return false;
    if(f.type!=='todos'&&t.type!==f.type)return false;
    const k=dueInfo(t).k; if(f.venc==='late'&&k!=='late')return false; if(f.venc==='soon'&&k!=='soon')return false;
    return true;});
}
function ticketTable(list,compact){
  return `<div class="tbl-wrap"><table><thead><tr><th>Folio</th><th>Código</th><th>Motivo</th>${compact?'':'<th>Orden</th><th>Registró</th>'}<th>Responsable</th>${compact?'':'<th>Esperando a</th>'}<th>Plazo</th><th>Estado</th></tr></thead><tbody>
  ${list.length?list.map(t=>{const d=dueInfo(t);return `<tr class="click ${d.k==='late'?'late':d.k==='soon'?'soon':''}" data-a="open" data-v="${t.id}" tabindex="0">
    <td class="mono"><b>${t.id}</b></td><td><span class="mono">${esc(idl(t))}</span> <span class="chip ${t.plat==='MX'?'mx':t.plat==='ES'?'es':'neutral'}">${t.plat}</span></td><td>${TYPES[t.type].l}</td>
    ${compact?'':`<td>${enrChip(t)}</td><td>${esc(t.reporter)}<div class="muted small">${fdt(t.created)}</div></td>`}
    <td>${t.owner?esc(t.owner):isOpen(t)?'<span class="chip warn">Sin asignar</span>':'<span class="muted">—</span>'}</td>${compact?'':`<td>${t.waiting&&isOpen(t)?esc(t.waiting):'<span class="muted">—</span>'}</td>`}
    <td>${d.html}</td><td>${stChip(t.status)}</td></tr>`}).join('')
  :`<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">Ningún ticket coincide con los filtros.</td></tr>`}
  </tbody></table></div>`;
}

    <div class="field"><label class="lbl" for="f-or">Origen</label><select id="f-or" data-fl="orig"><option value="todos">MX y ES</option><option value="MX" ${f.orig==='MX'?'selected':''}>Bringgo · MX</option><option value="ES" ${f.orig==='ES'?'selected':''}>EasyShip · ES</option></select></div>
    <div class="field"><label class="lbl" for="f-ve">Vencimiento</label><select id="f-ve" data-fl="venc"><option value="todos">Cualquiera</option><option value="soon" ${f.venc==='soon'?'selected':''}>Vence en 24 h</option><option value="late" ${f.venc==='late'?'selected':''}>Vencidos</option></select></div>

}

function rDupMgmt(t){
  if(!t.dupConfirmed) return `<section><div class="lbl">Mercancía duplicada</div><p class="small">Sin confirmar. Al confirmar inicia el plazo especial de 10 días naturales.</p>
    <button class="btn full" data-a="confirmdup" ${can('confirmdup')&&isOpen(t)?'':'disabled'}>Confirmar que es duplicado</button></section>`;
  const total=10*D, left=t.dupDue-NOW, pct=Math.max(0,Math.min(100,(total-left)/total*100));
  return `<section><div class="lbl">Mercancía duplicada</div>
    <div class="small">Confirmó <b>${esc(t.dupConfirmed.who)}</b> · ${fdt(t.dupConfirmed.at)}</div>
    <div class="countdown"><div class="bar"><i style="width:${pct}%;background:${left<0?'var(--bad)':left<2*D?'var(--warn)':'var(--brand)'}"></i></div><span class="num small">${left>0?dur(left)+' restantes':'plazo cumplido'}</span></div>
    <div class="small muted">Revisión inicial: ${dur(t.dupConfirmed.at-t.created)} · Plazo especial: 10 d (vence ${fdt(t.dupDue)})</div>
    ${t.status==='Dispose programado'?`<div class="confirmbox"><b>Dispose programado</b><span class="small">La disposición física no se marca como realizada hasta subir la evidencia.</span>
      ${fileBox2('dsp','Evidencia de la disposición')}
      <button class="btn danger" data-a="disposedone" ${can('dispose')&&S.pend.dsp?'':'disabled'}>Confirmar Dispose realizado</button>${can('dispose')?'':'<span class="muted small">Solo Victor y Francisco R. confirman la disposición.</span>'}</div>`:''}
  </section>`;
}
const fileBox2=(k,l)=>`<div class="file"><label class="lbl" for="ev-${k}">${l}</label><input type="file" id="ev-${k}" data-ev="${k}" accept="image/*">${S.pend[k]?`<span class="chip ok">✓ ${esc(S.pend[k].name)}</span>`:''}</div>`;
function rDiscard(t){
  const st=S.ui.disc||0;
  if(!can('discard'))return `<span class="muted small">Descartar una incidencia requiere permiso especial.</span>`;
  if(st===0)return `<button class="btn ghost-danger full" data-a="disc1">Descartar incidencia reportada por error…</button>`;
  return `<div class="confirmbox"><b>Descartar ${t.id}</b>

/* ===================== RENDER / RUTAS ===================== */
const VIEWS={registro:vRegistro,misreportes:vMisReportes,tablero:vTablero,tickets:vTickets,duplicados:vDuplicados,danados:vDanados,descartes:vDescartes,retornos:vRetornos,equipo:vEquipo};
function render(focus){
  renderNav(); $('#view').innerHTML=VIEWS[S.view]();
  if(S.view==='registro'&&focus!==false){const R=S.R;const el=R&&R.focusCode?$('#code'):(!R||R.step===1)?$('#scan'):null;el&&el.focus();if(R)R.focusCode=false;}
}
function route(){const h=location.hash.slice(1);const allowed=navFor().map(x=>x[0]);S.view=VIEWS[h]&&allowed.includes(h)?h:(isAdmin()?'tickets':'registro');S.sel=null;S.ui={};render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
function openTicket(id){S.sel=id;S.tab='chat';S.ui={};S.pend={};if(S.view!=='tickets'){history.replaceState(null,'','#tickets');S.view='tickets';}render();window.scrollTo(0,0);}

/* ===================== ACCIONES DE TICKET ===================== */
const TK=()=>S.tickets.find(x=>x.id===S.sel);
function tAct(a){
  const t=TK(); if(!t)return;
  switch(a){
   case 'take':{ if(!need('take'))return;
     // Toma atómica en backend: UPDATE tickets SET owner_id=:me WHERE id=:id AND owner_id IS NULL
     if(t.owner){toast(`<b>${esc(t.owner)}</b> tomó este ticket un instante antes. No se sobrescribió.`);break;}
     t.owner=S.op; t.assign.push({at:NOW,who:S.op,a:'Tomó el ticket'}); hist(t,'Tomó el ticket'); if(t.status==='Abierto')t.status=t.waiting?'Esperando respuesta':'En gestión';
     logAdd(`Tomó ${t.id}`); toast(`${t.id} asignado a <b>${esc(S.op)}</b> · ${fdt(NOW)}`); break;}
   case 'release':{ if(t.owner!==S.op&&!need('transfer'))return; const prev=t.owner; t.owner=null; t.assign.push({at:NOW,who:S.op,a:'Liberó (era '+prev+')'}); hist(t,'Liberó el ticket (responsable anterior: '+prev+')'); if(t.status==='En gestión')t.status='Abierto'; toast(`${t.id} liberado. Vuelve a “Sin responsable”.`); break;}
   case 'transfer':{ if(t.owner!==S.op&&!need('transfer'))return; const to=$('#xfer').value, prev=t.owner; t.owner=to; t.assign.push({at:NOW,who:S.op,a:`Transfirió de ${prev} a ${to}`}); hist(t,`Transfirió de ${prev} a ${to}`); toast(`${t.id} transferido a <b>${esc(to)}</b>`); break;}
   case 'saveloc':{ const v=$('#loc').value.trim(); if(v===t.loc)return; t.loc=v; hist(t,'Ubicación física: '+(v||'sin registrar')); toast('Ubicación guardada'); break;}
   case 'confirmdup':{ if(!need('confirmdup'))return; t.dupConfirmed={at:NOW,who:S.op}; t.dupDue=NOW+10*D; hist(t,'Confirmó mercancía duplicada · inicia plazo de 10 días (vence '+fdt(t.dupDue)+')'); toast(`Duplicado confirmado. Vence ${fdt(t.dupDue)}.`); break;}
   case 'resolve':{ if(!need('resolve'))return; if(t.owner!==S.op){toast('Toma el ticket para resolverlo.');return;} const r=$('#res').value.trim(); if(r.length<8){toast('Escribe la resolución final (qué se hizo y dónde quedó el paquete).');$('#res').focus();return;}
     t.status='Resuelto'; t.resolution=r; hist(t,'Resolvió: '+r); logAdd(`Resolvió ${t.id}`); S.ui.res=''; toast(`${t.id} resuelto`); break;}
   case 'disposedone':{ if(!need('dispose'))return; if(!S.pend.dsp){toast('Sube la evidencia de la disposición.');return;} t.ev.push({...S.pend.dsp,by:S.op,at:NOW}); t.status='Dispose realizado'; hist(t,'Confirmó Dispose realizado con evidencia'); const l=S.disposeLog.find(x=>x.id===t.id); if(l)l.done=NOW; S.pend.dsp=null; toast('Disposición registrada con evidencia'); break;}
   case 'disc1': if(!need('discard'))return; S.ui.disc=1; break;
   case 'disc0': S.ui.disc=0; break;
   case 'disc2': if((S.ui.why||'').trim().length<10){toast('La justificación es obligatoria (mínimo 10 caracteres).');return;} S.ui.disc=2; break;
   case 'discgo':{ if(!need('discard'))return; t.prevStatus=t.status; t.status='Descartado'; t.discard={at:NOW,who:S.op,why:S.ui.why.trim()}; hist(t,'Descartó la incidencia: '+t.discard.why); logAdd(`Descartó ${t.id}`); S.ui={}; toast(`${t.id} pasó al archivo de descartes. Historial y evidencias se conservan.`); break;}
   case 'openchat': t.chatOpen=true; break;
   case 'sendchat':{ const txt=($('#cmsg').value||'').trim(); if(!txt&&!S.pend.chat){toast('Escribe un mensaje o adjunta una foto.');return;}
     const tag=$('#ctag').value; t.chat.push({at:NOW,who:S.op,tag,text:txt,img:S.pend.chat?.src||null}); if(S.pend.chat)t.ev.push({...S.pend.chat,by:S.op,at:NOW});
     hist(t,tag==='Mensaje'?'Escribió en el chat':'Documentó: '+tag); S.ui.cmsg=''; S.pend.chat=null; break;}
   case 'addev':{ if(!S.pend.tk)return; t.ev.push({...S.pend.tk,by:S.op,at:NOW}); hist(t,'Agregó evidencia: '+S.pend.tk.name); S.pend.tk=null; break;}
  }
  render(false);
}

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.ev){const file=el.files&&el.files[0];if(!file)return;const key=el.dataset.ev;
    const r=new FileReader();r.onload=()=>{S.pend[key]={name:file.name,src:file.size<4e6?r.result:null};render(false);};r.readAsDataURL(file);return;}
  if(el.dataset.chk&&S.R){S.R.chk[el.dataset.chk]=el.checked;render(false);return;}
  if(el.dataset.radio&&S.R){S.R.f[el.dataset.radio]=el.value;render(false);return;}
  if(el.dataset.q&&S.R){S.R.f.q=+el.dataset.q;render(false);return;}
  if(el.dataset.dmg){const t=S.tickets.find(x=>x.id===el.dataset.dmg);t.dmg=el.value;hist(t,'Desenlace del envío dañado: '+el.value);toast(`${t.id} → ${esc(el.value)}`);render(false);return;}
  if(el.dataset.fl){S.fl[el.dataset.fl]=el.value;render();return;}
  if(el.dataset.a==='waiting'){const t=TK();const v=el.value||null;if(v===t.waiting)return;t.waiting=v;if(v){t.status='Esperando respuesta';hist(t,'Esperando respuesta de '+v);}else{t.status=t.owner?'En gestión':'Abierto';hist(t,'Ya no se espera respuesta de otro departamento');}render(false);}
});
document.addEventListener('click',e=>{
  const nl=e.target.closest('.nav a'); if(nl&&nl.getAttribute('href')===location.hash){e.preventDefault();route();return;}
  const el=e.target.closest('[data-a]'); if(!el)return;
  const a=el.dataset.a, v=el.dataset.v;
  if(el.tagName==='SELECT'||el.dataset.ev)return;
  if(['take','release','transfer','saveloc','confirmdup','resolve','disposedone','disc1','disc0','disc2','discgo','openchat','sendchat','addev'].includes(a)){tAct(a);return;}
  switch(a){
   case 'tick':{NOW+=D;runAgent();const n=runJobs();render(false);toast(`Reloj +1 día → ${fdt(NOW)}. Proceso programado: ${n} cambio(s).`);break;}
   case 'fast':{NOW+=180000;const n=runAgent();render(false);toast(`Reloj +3 min → ${fdt(NOW)}. Agente de búsqueda: ${n} ticket(s) con información nueva.`);break;}
   case 'acct':{if(!need('users'))break;const a=S.accounts[v]||(S.accounts[v]={});a[el.dataset.k]=true;toast(`Cuenta de ${el.dataset.k==='easy'?'EasyShip':'Bringgo'} de ${esc(v)} conectada (simulado). En el sistema real se abre un formulario seguro.`);render(false);break;}
   case 'useacct':{if(!need('users'))break;S.agentAccount=v;toast(`El agente ahora consulta con la cuenta de ${esc(v)}.`);render(false);break;}
   case 'research':{const t=TK();const v=($('#recode').value||'').trim();if(!v){toast('Escribe un MX/ES o una guía.');break;}const nc=normCode(v);if(nc){t.code=nc;t.plat=nc.slice(0,2);}else t.trk=v;queueEnrich(t);hist(t,'Pidió nueva búsqueda con '+v);render(false);toast('En cola. La información llega en 2–3 min.');break;}
   case 'open': openTicket(v);break;
   case 'back': S.sel=null;S.ui={};render();break;
   case 'tab': S.tab=v;render(false);break;
   case 'restore':{if(!need('restore'))return;const t=S.tickets.find(x=>x.id===v);t.status=t.prevStatus||'Abierto';hist(t,'Restauró la incidencia descartada');logAdd('Restauró '+t.id);toast(`${t.id} restaurado a ${t.status}`);render();break;}
   case 'scan': S.last=null;identify($('#scan').value,'scan');render();break;
   case 'usecode': S.last=null;{const bad=S.R&&S.R.badTrk;identify($('#code').value,'code');if(bad&&S.R&&S.R.step>1&&!S.R.badTrk)S.R.badTrk=bad;}render();break;
   case 'sample':{S.last=null;S.pend={};const how=el.dataset.how;
      if(how==='scan'){S.R=null;S.ui={scan:v};identify(v,'scan');}else{S.ui={...S.ui,code:v};const bad=S.R&&S.R.badTrk;S.R=bad?{...newR(),badTrk:bad}:null;identify(v,'code');}
      render();break;}
   case 'nolabel': S.last=null;S.pend={};noLabel();render();break;
   case 'restart': S.R=null;S.pend={};S.ui={};render();break;
   case 'type': S.R.type=v;S.R.f={};render(false);{const i=$('#f-otro')||$('#f-desc');if(i)i.focus();else $('[data-a=register]')?.focus();}break;
   case 'retype': S.R.step=2;S.R.type=null;S.R.dupHint=null;render(false);break;
   case 'register': register();break;
   case 'addret':{const t=$('#rt').value.trim().toUpperCase();if(!t){toast('Escribe la guía o el código del retorno.');$('#rt').focus();break;}
      const ex=S.returns.find(r=>r.trk===t);if(ex){toast(`${esc(t)} ya se registró ${fdt(ex.at)} por ${esc(ex.who)}. No se duplicó.`);break;}
      S.returns.unshift({at:NOW,trk:t,car:$('#rc').value,why:$('#rw').value,who:S.op,tk:null});logAdd('Retorno registrado '+t);
      const dm=S.tickets.find(x=>x.type==='danado'&&x.status==='Enviado dañado'&&x.code===t);if(dm){dm.dmg='Regresó';hist(dm,'Regresó: retorno registrado por '+S.op);S.returns[0].tk=dm.id;toast(`Retorno registrado. Era un envío dañado (${dm.id}); se marcó como “Regresó”.`);}else toast('Retorno registrado');render();break;}
   case 'rettk':{const r=S.returns[+v];const res=createTicket({type:'retorno',code:r.trk,plat:r.trk.startsWith('ES')?'ES':'MX',note:`Retorno ${r.car}: ${r.why}`,loc:'Área de retornos'});r.tk=res.t.id;hist(res.t,'Creado desde registro de retornos de '+r.who);toast(`${res.t.id} creado para el retorno ${esc(r.trk)}`);render();break;}
  }
});

runJobs(); S.jobRuns=[];
/* Reloj en vivo: avanza en tiempo real y el agente revisa su cola cada segundo */
setInterval(()=>{
  NOW+=1000; const c=$('#clk'); if(c)c.textContent=fdt(NOW);
  document.querySelectorAll('[data-eta]').forEach(el=>{const ms=+el.dataset.eta-NOW;el.textContent=ms>0?'~'+mmss(ms):'en unos segundos';});
  const n=runAgent();
  if(n&&isAdmin()&&['tickets','tablero','duplicados'].includes(S.view)){
    const a=document.activeElement;
    if(a&&$('#view').contains(a)&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))S.pendRender=true; else render(false);
    toast(`Agente de búsqueda: ${n} ticket(s) con información de la orden.`);
  }
},1000);
document.addEventListener('focusout',()=>{if(S.pendRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&$('#view').contains(a)&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))){S.pendRender=false;render(false);}},300);});
route();
</script>
